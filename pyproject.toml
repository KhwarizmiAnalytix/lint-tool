[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lint-tool"
version = "2026.9.14"
description = "lintrunner adapters for C++/Python/CMake repositories"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
    { name = "KhwarizmiAnalytix" },
]
keywords = ["lintrunner", "lint", "clang-format", "ruff", "cmake"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/KhwarizmiAnalytix/lint-tool"
Source = "https://github.com/KhwarizmiAnalytix/lint-tool"
Issues = "https://github.com/KhwarizmiAnalytix/lint-tool/issues"

[project.scripts]
lint-tool = "lint_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lint_tool.adapters" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
